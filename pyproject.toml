[tool.ruff]
line-length = 200
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Correctness-focused rule set: syntax errors, undefined names, unused
# imports/variables, and common pyflakes/pycodestyle issues. Deliberately
# leaves formatting/import-sorting rules off so this doesn't force an
# unrelated repo-wide reformat.
select = ["E4", "E7", "E9", "F", "W291", "W292", "W293"]
